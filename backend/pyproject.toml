[project]
name = "backend"
version = "0.1.0"
description = "ContextAI RAG Backend Engine"
readme = "README.md"
authors = [
    { name = "Harsh-Dobaria", email = "hkd4506@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn>=0.52.0",
    "pydantic>=2.13.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.50",
    "alembic>=1.19.0",
    "faiss-cpu>=1.15.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.0",
    "numpy>=2.5.0",
    "google-genai>=2.19.0",
    "langgraph>=1.2.0",
    "pypdf>=6.16.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.0",
]

[project.scripts]
backend = "app.main:app"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
